name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: RomFlasherSimulator.apk
          name: "ROM Flasher & Root Simulator ${{ github.ref_name }} (4PDA Edition)"
          body: |
            ⚡ **RomFlasherSimulator.apk** готов к установке!

            ### Что нового в v1.6.0 (Real Gameplay & Modder Tools Update):
            - 🎮 **PUBG Mobile 120 FPS Arena (РЕАЛЬНАЯ ИГРА)**:
              • Полноценный 2D Canvas шутер прямо на экране смартфона с управлением D-Pad / тапом!
              • Волны вражеских дронов, стрельба пулями, частицы взрывов, счетчик очков и жизней!
              • Честный замер FPS на delta-time: 60 FPS на стоке или честные 120 FPS при разгоне ядра!
              • Звуки стрельбы, взрывов и попаданий через Web Audio API.
            - ⚡ **Franco Kernel Manager (FKM Overclock Studio)**:
              • Реальный оверклокер ядра: выбор частот Prime-ядра (до 3.20 GHz Extreme OC), частоты Adreno 640 (675/750/825 MHz), говерноров (schedutil/performance/powersave) и профилей охлаждения!
              • Напрямую разгоняет AnTuTu Benchmark (свыше 1,000,000+ очков!) и скорость стрельбы в PUBG!
            - 💬 **Клиент 4PDA Форума и Биржа Заказов (Фриланс)**:
              • Интерактивные форумные треды: помогайте новичкам оживлять окирпиченные Poco X3 Pro из CrashDump, советуйте кастомные ядра, обходите СберБанк и получайте +Репутацию!
              • Биржа заказов на прошивку: берите заказы клиентов (прошить PixelOS, включить 120 FPS, настроить банковские клиенты), сдавайте их и прокачивайте свой моддерский ранг (до Легенды 4PDA)!
            - 📂 **MT Manager (Root Explorer & build.prop Editor)**:
              • Файловый менеджер с навигацией по разделам `/system`, `/data`, `/sdcard`.
              • Настоящий редактор `build.prop`: меняйте название модели (`ro.product.model=Pixel 8 Pro`) и системные флаги с авто-применением в ОС!
            - 💻 **Расширенный Linux Bash в Termux**:
              • Реальные команды: `ls`, `cat`, `df -h`, `free -m`, `ps`, `top`, `neofetch`, `uname -a`, `su`/`ksu`, `reboot recovery`, `whoami`.

            ### Установка через ADB:
            ```bash
            adb install RomFlasherSimulator.apk
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
