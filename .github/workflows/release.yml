name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: RomFlasherSimulator.apk
          name: "ROM Flasher & Root Simulator ${{ github.ref_name }} (4PDA Edition)"
          body: |
            ⚡ **RomFlasherSimulator.apk** готов к установке!

            ### Что нового в v1.4.0 (Mega Settings Update):
            - ⚙️ **Полноценные системные Настройки Android 14**:
              • **Живой поиск**: мгновенная фильтрация параметров прямо по мере ввода.
              • **Карточка профиля 4PDA**: аватар, статус синхронизации и репутация моддера.
              • **О телефоне (About Phone)**: процессор Snapdragon 860, RAM+, хранилище UFS 3.1, ядро Linux, статус загрузчика, переключатель SELinux Enforcing / Permissive, 7 тапов по сборке с вибро- и звуковым откликом для разблокировки режима разработчика.
              • **Пасхалка Android 14 (Easter Egg)**: при тройном нажатии на «Версия Android 14» запускается космическая миссия UpsideDownCake с ракетой!
              • **Экран и графика**: переключение 60 Гц / 90 Гц / 120 Гц, тумблер Peak Refresh Rate (принудительные 120 FPS), тёмная тема AMOLED, цветовой охват DCI-P3, DPI масштабирование (392/440 dp).
              • **Батарея и производительность**: живой мониторинг емкости (5160 мАч), температуры (31.8°C), переключатель профилей Эко / Баланс / Game Turbo 🚀, диаграмма расхода аккумулятора приложениями.
              • **Сеть и подключения**: Wi-Fi 5 GHz, 4G+ VoLTE, частный DNS AdGuard с блокировкой рекламы.
              • **Безопасность и Root**: Play Integrity (Basic / Device / Strong), статус KernelSU и Magisk, шифрование FBE v2.
              • **Для разработчиков**: тумблер «Отладка по USB» (интегрирован с ADB в ПК консоли!), принудительный 4x MSAA, отображение частоты экрана, скорость анимаций.
              • **Меню перезагрузки и сброса**: быстрый перезапуск в Систему, TWRP / OrangeFox Recovery, Fastboot, аварийный EDL 9008, очистка Dalvik/ART кэша и сброс до заводских (Format Data).

            ### Установка через ADB:
            ```bash
            adb install RomFlasherSimulator.apk
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
