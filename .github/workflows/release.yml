name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: RomFlasherSimulator.apk
          name: "ROM Flasher & Root Simulator ${{ github.ref_name }} (4PDA Edition)"
          body: |
            ⚡ **RomFlasherSimulator.apk** готов к установке!

            ### Что внутри:
            - 📱 Эмулятор смартфона Poco X3 Pro с Fastboot и TWRP 3.7
            - 💻 Рабочая станция мододела (консоль ADB/Fastboot, ветка 4PDA, Mi Flash Tool)
            - 🚀 Интерактивные ОС: Stock HyperOS, PixelOS, LineageOS, crDroid Gaming
            - 🛠️ Termux с root (su), Magisk v27, СберБанк с Play Integrity и AnTuTu с оверклоком
            - 🏆 Система квестов и репутации 4PDA

            ### Установка через ADB:
            ```bash
            adb install RomFlasherSimulator.apk
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
