name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: RomFlasherSimulator.apk
          body_path: RELEASE_NOTES.md
          name: "ROM Flasher & Root Simulator ${{ github.ref_name }} (4PDA Authentic Edition)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
