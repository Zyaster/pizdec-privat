name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: RomFlasherSimulator.apk
          name: "ROM Flasher & Root Simulator ${{ github.ref_name }} (4PDA Edition)"
          body: |
            ⚡ **RomFlasherSimulator.apk** готов к установке!

            ### Что нового в v1.3.0:
            - 👑 **KernelSU & Custom Kernels**: поддержка KernelSU v0.9.5 (ядерный рут) вместо устаревшего Magisk! Ядра NoGravity (NGK) и StormBreaker OC 3.2GHz!
            - 🦊 **OrangeFox Recovery R11.1** & **TWRP 3.7**: полноценные рекавери с кастомным терминалом, Aroma-инсталлятором и бекапами!
            - 🎨 **Уникальный визуал для всех 6 ОС**:
              • **HyperOS 1.0**: фирменный split-clock, Mi Health виджет, стеклянный Mi Dock.
              • **PixelOS 14**: Google "At a Glance" погода, 2-строчные Material You часы, панель Google поиска и монохромные иконки.
              • **LineageOS 21**: чистый минималистичный AOSP, Lineage Trust SELinux статус.
              • **crDroid 10.5**: киберспортивный Gaming HUD (120 FPS, Adreno 640 @ 825MHz, мониторинг температуры).
              • **Evolution X 8.5**: типографические часы, Themer с неоновыми акцентами.
              • **Kali NetHunter**: матричная сетка, CRT хакерский терминал и утилиты аудита.
            - 📲 **100% Fullscreen AMOLED**: полноэкранная перезагрузка, физические кнопки громкости и питания на торцах экрана, вызов меню ПК.
            - 🏦 **СберБанк & LSPosed & ViPER4Android**: обход Play Integrity через KernelSU unmount, разгон до 120 FPS в PUBG Mobile!

            ### Установка через ADB:
            ```bash
            adb install RomFlasherSimulator.apk
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
