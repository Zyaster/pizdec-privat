name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: RomFlasherSimulator.apk
          name: "ROM Flasher & Root Simulator ${{ github.ref_name }} (4PDA Edition)"
          body: |
            ⚡ **RomFlasherSimulator.apk** готов к установке!

            ### Что нового в v1.5.0 (Recovery Navigation Update):
            - 🦊 **Аутентичный навбар Recovery (TWRP 3.7 & OrangeFox)**:
              • Добавлена кнопка **«◀ Назад»** в верхнюю панель заголовка рекавери.
              • Добавлен классический нижний навбар: **[ ◀ Back ]**, **[ 🏠 Home ]**, **[ ≡ Console/Log ]**, **[ 🔄 Reboot ]**.
              • Кнопка **«◀ Назад в меню»** на экране лога консоли (`rec-page-console`) — теперь после прошивки не обязательно сразу перезагружаться, можно вернуться и дошить ядро или очистить кэш.
              • Полноценные интерактивные разделы для всех 8 плиток (Install, Wipe, Backup, Restore, Mount, Settings, Advanced, Reboot) с кнопками возврата «◀ Назад в главное меню».
              • Возможность безопасного выхода из главного экрана рекавери в систему через диалог подтверждения Reboot System.

            ### Установка через ADB:
            ```bash
            adb install RomFlasherSimulator.apk
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
