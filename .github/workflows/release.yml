name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: RomFlasherSimulator.apk
          name: "ROM Flasher & Root Simulator ${{ github.ref_name }} (4PDA Authentic Edition)"
          body: |
            ⚡ **RomFlasherSimulator.apk** готов к установке!

            ### Что нового в v1.7.0 (Authentic Modder UI & Zero-AI Aesthetics Overhaul):
            - 🎯 **Полное избавление от "ИИ-стиля" и эмодзи-заглушек**:
              • Полная замена дешевых смайликов на четкую векторную графику (SVG) во всех плитках TWRP, лаунчере, настройках и системных шторках.
            - 🐰 **Официальный экран Xiaomi Fastboot**:
              • Реалистичный AMOLED экран с векторной иллюстрацией зайца Mitu (Mi Bunny) в ушанке с красной звездой, чинящего упавшего зеленого робота Android паяльником и отверткой с искрами.
              • Фирменный неоново-оранжевый техно-шрифт `FASTBOOT` с аутентичным терминальным блоком характеристик в верхнем левом углу.
            - 📶 **Настоящий Android Status Bar & Battery Capsule**:
              • Фирменный 4-полосный индикатор сигнала сотовой сети `5G` / `4G+`.
              • Аккуратный SVG-индикатор Wi-Fi дуги.
              • Реальная батарейная капсула с динамическим заполнением уровня заряда и процентами.
            - 🛠️ **Официальные плитки TWRP 3.7.0 & Навигация**:
              • Векторные монохромные иконки для всех 8 плиток (Install, Wipe, Backup, Restore, Mount, Settings, Advanced, Reboot).
              • Индикатор температуры процессора (`42°C`), логотип TeamWin swirl.
              • Нижний навбар: `[ ◀ Back ]`, `[ 🏠 Home ]`, `[ ≡ Log ]`, `[ 🔄 Reboot ]`.
            - 📱 **Аутентичные векторные иконки приложений лаунчера**:
              • Иконки с оригинальными шейпами: Settings (шестеренка Material You), 4PDA (классический синий шильдик 4pda), FKM (разгон и молния), MT Manager (двухпанельный APK-менеджер), PUBG (шлем 3-го уровня с прицелом), Termux (консольный курсор), СберБанк (изумрудная галка), AnTuTu (пламя бенчмарка), KernelSU / Magisk.
            - 💬 **Настоящий стиль форума 4PDA (IPB / vBulletin)**:
              • Синяя шапка `#005999`, навигационные хлебные крошки ветки Poco X3 Pro, цитаты `[quote]...[/quote]`, авторские карточки, плашки репутации `[ - | +42 ]`, бейджи файлов `.zip`, `.img`, `.apk`, `.tgz` и 100% живой сленг моддеров (отвал, кирпич, реболл, бутлуп, шапка).
            - 🔈 **Тактильные физические клики**:
              • Настроенный haptic-импульс через Web Audio API.

            ### Установка через ADB:
            ```bash
            adb install RomFlasherSimulator.apk
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
