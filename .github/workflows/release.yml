name: Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK if needed
        run: |
          if [ ! -f "RomFlasherSimulator.apk" ]; then
            chmod +x ./build_apk.sh
            ./build_apk.sh
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          fi

          # Create or update git tag if needed
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Delete existing release for this tag if exists
          gh release delete "$TAG" --yes || true
          git tag -d "$TAG" || true

          gh release create "$TAG" \
            RomFlasherSimulator.apk \
            --title "AndroFlash: ROM Flasher & Root Simulator $TAG (4PDA Edition)" \
            --notes "⚡ **RomFlasherSimulator.apk** готов к установке!

### Что внутри:
- 📱 Эмулятор смартфона Poco X3 Pro с Fastboot и TWRP 3.7
- 💻 Рабочая станция мододела (консоль ADB/Fastboot, ветка 4PDA, Mi Flash Tool)
- 🚀 Интерактивные ОС: Stock HyperOS, PixelOS, LineageOS, crDroid Gaming
- 🛠️ Termux с root (su), Magisk v27, СберБанк с Play Integrity и AnTuTu с оверклоком
- 🏆 Система квестов и репутации 4PDA

### Установка:
\`\`\`bash
adb install RomFlasherSimulator.apk
\`\`\`"
